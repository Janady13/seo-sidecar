# ─────────────────────────────────────────────────────────────────────────────
# SEO SIDECAR NGINX CONFIG — replaces static sub_filter with live SSI
# 
# HOW IT WORKS:
#   1. nginx receives a request for any hosted site
#   2. SSI directive fetches JSON-LD from sidecar at localhost:9090
#   3. Schema is injected into </head> dynamically
#   4. Site files are NEVER touched
#
# INSTALLATION:
#   1. Save as /etc/nginx/conf.d/seo-sidecar-upstream.conf
#   2. Add the SSI snippet to each site's server block (or use the map)
#   3. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ─── Upstream: Sidecar Service ────────────────────────────────────────────────
upstream seo_sidecar {
    server 127.0.0.1:9090;
    keepalive 8;
}

# ─── Map: hostname → site key ─────────────────────────────────────────────────
# This maps the incoming $host to the schema key in the sidecar database.
# Add new sites here — no other config changes needed.
map $host $seo_site_key {
    default                         "";
    thatdeveloperguy.com            "thatdeveloperguy";
    www.thatdeveloperguy.com        "thatdeveloperguy";
    thatcoputerdude.com             "thatcoputerdude";
    www.thatcoputerdude.com         "thatcoputerdude";
    thatwebhostingguy.com           "thatwebhostingguy";
    www.thatwebhostingguy.com       "thatwebhostingguy";
    thataiguy.org                   "thataiguy";
    www.thataiguy.org               "thataiguy";
    feedthejoe.com                  "feedthejoe";
    www.feedthejoe.com              "feedthejoe";
    freeaicharity.org               "freeaicharity";
    www.freeaicharity.org           "freeaicharity";
    aimusicinteraction.org          "aimusicinteraction";
    www.aimusicinteraction.org      "aimusicinteraction";
    tcbfightfactory.com             "tcbfightfactory";
    www.tcbfightfactory.com         "tcbfightfactory";
    tcb-fight-team.com              "tcbcombatsports";
    www.tcb-fight-team.com          "tcbcombatsports";
    tcbcombatsports.com             "tcbcombatsports";
    www.tcbcombatsports.com         "tcbcombatsports";
}


# ─────────────────────────────────────────────────────────────────────────────
# OPTION A: Drop-in SSI snippet for each server block
# 
# Add this inside each site's server block. That's it.
# Works with your existing site configs — no other changes.
# ─────────────────────────────────────────────────────────────────────────────
#
#   # Inside your existing server { } block:
#   ssi on;
#   ssi_silent_errors on;
#
#   # Inject schema before </head>
#   sub_filter '</head>' '<!--# include virtual="/seo-schema-inject" -->\n</head>';
#   sub_filter_once on;
#   sub_filter_types text/html;
#
#   # Internal endpoint that fetches from sidecar
#   location = /seo-schema-inject {
#       internal;
#       proxy_pass http://seo_sidecar/schema/$seo_site_key;
#       proxy_set_header Host $host;
#       proxy_cache_valid 200 5m;
#   }


# ─────────────────────────────────────────────────────────────────────────────
# OPTION B: Shared include file (cleaner for 9+ sites)
#
# Save the snippet below as /etc/nginx/snippets/seo-inject.conf
# Then just add ONE line to each server block:
#   include /etc/nginx/snippets/seo-inject.conf;
# ─────────────────────────────────────────────────────────────────────────────


