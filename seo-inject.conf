# /etc/nginx/snippets/seo-inject.conf
# Include this in any server block with:  include /etc/nginx/snippets/seo-inject.conf;
# Requires: /etc/nginx/conf.d/seo-sidecar-upstream.conf loaded first

ssi on;
ssi_silent_errors on;

# Inject sidecar output right before </head>
sub_filter '</head>' '<!--# include virtual="/seo-schema-inject" -->\n</head>';
sub_filter_once on;
sub_filter_types text/html;

location = /seo-schema-inject {
    internal;
    proxy_pass http://seo_sidecar/schema/$seo_site_key;
    proxy_set_header Host $host;

    # Cache 5min — sidecar holds fresh data, this just reduces hits
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;

    # Don't let sidecar downtime slow page loads
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
